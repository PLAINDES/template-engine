services:
  docx-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prosedi_docx_service
    restart: always
    ports:
      - "8001:8001"
    environment:
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=prosedi
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M
        reservations:
          cpus: "0.5"
          memory: 256M
    networks:
      - prosedi_net
      - proproyectapi_prosedi_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  prosedi_net:
    external: true
  proproyectapi_prosedi_net:
    external: true
